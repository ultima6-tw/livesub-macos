name: JaSub
options:
  bundleIdPrefix: tw.ultima6
  deploymentTarget:
    macOS: "26.4"
  defaultConfig: Debug
  localizations:
    - en
    - zh-Hant
    - zh-Hans
    - ja
    - ko
    - fr
    - de
    - es
    - pt-BR
    - it
    - ar
    - ru
    - nl
    - pl
    - th
    - tr
    - uk
    - vi
    - id

targets:
  JaSub:
    type: application
    platform: macOS
    sources:
      - path: Sources
    resources:
      - path: Resources
        excludes:
          - "*.entitlements"
          - "Info-iOS.plist"
    postBuildScripts:
      - name: Copy Localizations
        script: |
          RESOURCES_DIR="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources"
          mkdir -p "$RESOURCES_DIR"
          for lproj in "${SRCROOT}/Resources"/*.lproj; do
            cp -r "$lproj" "$RESOURCES_DIR/"
          done
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.ultima6.jasub
        MARKETING_VERSION: "0.3.10"
        CURRENT_PROJECT_VERSION: 13
        MACOSX_DEPLOYMENT_TARGET: "26.4"
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/JaSub.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
